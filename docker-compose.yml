version: '3.8'

services:
  # Redis for ARQ background jobs
  redis:
    image: redis:7-alpine
    container_name: connecthub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ARQ Worker (background jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connecthub_worker
    command: arq app.workers.main.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
